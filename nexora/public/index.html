<style>

cs.onclick = e => { const b = e.target.closest('button'); if (!b || b.dataset.c === cur) return; cs.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); segMove(cs); cur = b.dataset.c; tween(cur === 'IRT' ? 1000000 : 10000000); };
